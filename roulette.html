<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DexFans Roulette</title>
  <link rel="stylesheet" href="casino.css">
</head>

<body>

<header class="casino-header">
  <a href="index.html" class="brand">
    <span class="brand-mark">♦</span>
    <span>DexFans Casino</span>
  </a>

  <div class="balance">
    <span class="balance-icon">◆</span>
    <span data-balance>10,000</span>
  </div>
</header>


<main class="page game-page">

  <div class="game-title">
    <h1>🎡 Roulette</h1>
    <p>Choose a number or colour. Spin the wheel.</p>
  </div>


  <section class="game-panel">

    <div class="roulette-wrap">

      <div
        class="roulette-wheel"
        data-roulette-wheel
      >
        <div class="roulette-center">
          ♦
        </div>
      </div>

    </div>


    <div
      class="result"
      data-result
    >
      Choose your bet.
    </div>


    <div class="controls">

      <div class="control-group">

        <label for="rouletteBet">
          Bet
        </label>

        <input
          id="rouletteBet"
          type="number"
          value="100"
          min="1"
          inputmode="numeric"
        >

      </div>

    </div>


    <div
      style="
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        margin-top:16px;
      "
    >

      <button
        class="btn btn-danger"
        onclick="selectColour('red')"
      >
        🔴 RED
      </button>

      <button
        class="btn"
        style="background:#090a0f;border:1px solid var(--border)"
        onclick="selectColour('black')"
      >
        ⚫ BLACK
      </button>

    </div>


    <div
      style="
        margin-top:18px;
        display:grid;
        grid-template-columns:repeat(6,1fr);
        gap:7px;
      "
    >

      <button class="btn" onclick="selectNumber(0)">0</button>
      <button class="btn" onclick="selectNumber(1)">1</button>
      <button class="btn" onclick="selectNumber(2)">2</button>
      <button class="btn" onclick="selectNumber(3)">3</button>
      <button class="btn" onclick="selectNumber(4)">4</button>
      <button class="btn" onclick="selectNumber(5)">5</button>

      <button class="btn" onclick="selectNumber(6)">6</button>
      <button class="btn" onclick="selectNumber(7)">7</button>
      <button class="btn" onclick="selectNumber(8)">8</button>
      <button class="btn" onclick="selectNumber(9)">9</button>
      <button class="btn" onclick="selectNumber(10)">10</button>
      <button class="btn" onclick="selectNumber(11)">11</button>

      <button class="btn" onclick="selectNumber(12)">12</button>
      <button class="btn" onclick="selectNumber(13)">13</button>
      <button class="btn" onclick="selectNumber(14)">14</button>
      <button class="btn" onclick="selectNumber(15)">15</button>
      <button class="btn" onclick="selectNumber(16)">16</button>
      <button class="btn" onclick="selectNumber(17)">17</button>

      <button class="btn" onclick="selectNumber(18)">18</button>
      <button class="btn" onclick="selectNumber(19)">19</button>
      <button class="btn" onclick="selectNumber(20)">20</button>
      <button class="btn" onclick="selectNumber(21)">21</button>
      <button class="btn" onclick="selectNumber(22)">22</button>
      <button class="btn" onclick="selectNumber(23)">23</button>

      <button class="btn" onclick="selectNumber(24)">24</button>
      <button class="btn" onclick="selectNumber(25)">25</button>
      <button class="btn" onclick="selectNumber(26)">26</button>
      <button class="btn" onclick="selectNumber(27)">27</button>
      <button class="btn" onclick="selectNumber(28)">28</button>
      <button class="btn" onclick="selectNumber(29)">29</button>

      <button class="btn" onclick="selectNumber(30)">30</button>
      <button class="btn" onclick="selectNumber(31)">31</button>
      <button class="btn" onclick="selectNumber(32)">32</button>
      <button class="btn" onclick="selectNumber(33)">33</button>
      <button class="btn" onclick="selectNumber(34)">34</button>
      <button class="btn" onclick="selectNumber(35)">35</button>

      <button class="btn" onclick="selectNumber(36)">36</button>

    </div>


    <div
      style="
        margin-top:22px;
        padding:16px;
        border-radius:15px;
        background:rgba(255,255,255,.035);
        text-align:center;
      "
    >

      <div
        style="
          color:var(--muted);
          font-size:13px;
          margin-bottom:6px;
        "
      >
        Selected bet
      </div>

      <strong
        id="selectedBet"
        style="font-size:20px"
      >
        None
      </strong>

    </div>


    <button
      id="spinButton"
      class="btn btn-primary"
      style="
        width:100%;
        margin-top:18px;
        padding:16px;
        font-size:18px;
        font-weight:800;
      "
      onclick="spinRouletteGame()"
    >
      SPIN WHEEL 🎡
    </button>


    <div
      style="
        margin-top:28px;
        padding-top:20px;
        border-top:1px solid var(--border);
        color:var(--muted);
        font-size:13px;
        line-height:1.6;
      "
    >

      <strong style="color:var(--text)">
        Payouts
      </strong>

      <br>

      Number: 35×
      <br>

      Red / Black: 2×

    </div>

  </section>


  <div style="
    text-align:center;
    margin-top:25px;
  ">

    <a href="index.html" class="btn">
      ← Back to Casino
    </a>

  </div>

</main>


<script src="casino.js"></script>

<script>

let selectedBet = null;


function selectColour(colour) {

  selectedBet = colour;

  document.getElementById("selectedBet").textContent =
    colour.toUpperCase();

}


function selectNumber(number) {

  selectedBet = String(number);

  document.getElementById("selectedBet").textContent =
    `NUMBER ${number}`;

}


function spinRouletteGame() {

  const bet =
    Number(
      document.getElementById("rouletteBet").value
    );

  const button =
    document.getElementById("spinButton");


  if (!selectedBet) {

    DexFansCasino.setResult(
      "Choose red, black or a number first.",
      "lose"
    );

    return;
  }


  if (
    !Number.isFinite(bet) ||
    bet <= 0
  ) {

    DexFansCasino.setResult(
      "Enter a valid bet.",
      "lose"
    );

    return;
  }


  if (
    bet >
    DexFansCasino.getBalance()
  ) {

    DexFansCasino.setResult(
      "You don't have enough credits.",
      "lose"
    );

    return;
  }


  button.disabled = true;
  button.textContent = "SPINNING…";


  DexFansCasino.spinRoulette(
    bet,
    selectedBet
  );


  setTimeout(() => {

    button.disabled = false;
    button.textContent = "SPIN WHEEL 🎡";

  }, 4400);

}

</script>

</body>
</html>
