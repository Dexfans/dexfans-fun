<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DexFans Plinko</title>
  <link rel="stylesheet" href="casino.css">
</head>

<body>

<header class="casino-header">
  <a href="index.html" class="brand">
    <span class="brand-mark">♦</span>
    <span>DexFans Casino</span>
  </a>

  <div class="balance">
    <span class="balance-icon">◆</span>
    <span data-balance>10,000</span>
  </div>
</header>


<main class="page game-page">

  <div class="game-title">
    <h1>🔮 Plinko</h1>
    <p>Drop the ball and chase the multiplier.</p>
  </div>


  <section class="game-panel">

    <div class="controls">

      <div class="control-group">
        <label for="plinkoBet">Bet</label>

        <input
          id="plinkoBet"
          type="number"
          min="1"
          value="100"
          inputmode="numeric"
        >
      </div>


      <div class="control-group">
        <label for="plinkoRisk">Risk</label>

        <select id="plinkoRisk">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>

    </div>


    <!-- PLINKO BOARD -->

    <div
      id="plinkoBoard"
      style="
        position:relative;
        width:100%;
        max-width:420px;
        height:430px;
        margin:25px auto 0;
        overflow:hidden;
        border:1px solid var(--border);
        border-radius:22px;
        background:
          radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.06),
            transparent 55%
          ),
          #08090e;
      "
    >

      <div
        id="pegs"
        style="
          position:absolute;
          inset:25px 20px 105px;
        "
      ></div>


      <div
        id="ball"
        style="
          position:absolute;
          width:18px;
          height:18px;
          left:50%;
          top:7px;
          transform:translateX(-50%);
          border-radius:50%;
          background:#fff;
          box-shadow:0 0 20px rgba(255,255,255,.7);
          display:none;
          z-index:5;
        "
      ></div>


      <div
        style="
          position:absolute;
          bottom:12px;
          left:12px;
          right:12px;
          display:grid;
          grid-template-columns:repeat(5,1fr);
          gap:5px;
        "
      >

        <div class="plinko-slot">0.2×</div>
        <div class="plinko-slot">0.5×</div>
        <div class="plinko-slot">1×</div>
        <div class="plinko-slot">2×</div>
        <div class="plinko-slot">5×</div>

      </div>

    </div>


    <div
      class="result"
      data-result
    >
      Choose your risk and drop the ball.
    </div>


    <button
      id="dropButton"
      class="btn btn-primary"
      style="
        width:100%;
        margin-top:18px;
        padding:16px;
        font-size:18px;
        font-weight:800;
      "
      onclick="dropBall()"
    >
      DROP BALL 🔮
    </button>


    <div
      style="
        margin-top:28px;
        padding-top:20px;
        border-top:1px solid var(--border);
        color:var(--muted);
        font-size:13px;
        line-height:1.7;
      "
    >

      <strong style="color:var(--text)">
        Risk levels
      </strong>

      <br>

      <strong>Low:</strong>
      safer multipliers.

      <br>

      <strong>Medium:</strong>
      balanced risk and reward.

      <br>

      <strong>High:</strong>
      much bigger potential payouts.

    </div>

  </section>


  <div style="text-align:center;margin-top:25px">
    <a href="index.html" class="btn">
      ← Back to Casino
    </a>
  </div>

</main>


<script src="casino.js"></script>

<script>

/* -------------------------
   CREATE PEGS
------------------------- */

const pegs =
  document.getElementById("pegs");

const rows = 9;

for (let row = 0; row < rows; row++) {

  const count = row + 3;

  for (let i = 0; i < count; i++) {

    const peg =
      document.createElement("div");

    peg.style.position = "absolute";
    peg.style.width = "7px";
    peg.style.height = "7px";
    peg.style.borderRadius = "50%";
    peg.style.background = "rgba(255,255,255,.45)";

    const x =
      ((i + 0.5) / count) * 100;

    const y =
      ((row + 0.5) / rows) * 100;

    peg.style.left = `${x}%`;
    peg.style.top = `${y}%`;

    peg.style.transform =
      "translate(-50%,-50%)";

    pegs.appendChild(peg);

  }

}


/* -------------------------
   ELEMENTS
------------------------- */

const ball =
  document.getElementById("ball");

const dropButton =
  document.getElementById("dropButton");


/* -------------------------
   DROP
------------------------- */

function dropBall() {

  if (dropButton.disabled) return;


  const bet =
    Number(
      document.getElementById(
        "plinkoBet"
      ).value
    );


  const risk =
    document.getElementById(
      "plinkoRisk"
    ).value;


  if (
    !Number.isFinite(bet) ||
    bet <= 0
  ) {

    DexFansCasino.setResult(
      "Enter a valid bet.",
      "lose"
    );

    return;

  }


  if (
    bet >
    DexFansCasino.getBalance()
  ) {

    DexFansCasino.setResult(
      "You don't have enough credits.",
      "lose"
    );

    return;

  }


  dropButton.disabled = true;

  dropButton.textContent =
    "BALL DROPPING…";


  ball.style.display = "block";

  ball.style.left = "50%";

  ball.style.top = "7px";


  /*
    Animate a believable path
    through the peg board.
  */

  const steps = 14;

  let step = 0;

  let x = 50;


  const animation =
    setInterval(() => {

      step++;


      /*
        Randomly bounce left/right.
      */

      x +=
        DexFansCasino.chance(.5)
          ? -4
          : 4;


      x =
        Math.max(
          10,
          Math.min(90, x)
        );


      ball.style.left =
        `${x}%`;


      ball.style.top =
        `${7 + step * 23}px`;


      if (step >= steps) {

        clearInterval(animation);


        setTimeout(() => {

          ball.style.display =
            "none";


          /*
            Run the actual game
            result through casino.js.
          */

          DexFansCasino.plinko(
            bet,
            risk
          );


          dropButton.disabled =
            false;

          dropButton.textContent =
            "DROP BALL 🔮";

        }, 250);

      }

    }, 90);

}

</script>

</body>
</html>
